<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<script>
			// Prerendered pages are served as static files and never reach hooks.server.ts,
			// so the production pages.dev alias is redirected here. Preview aliases stay usable.
			if (location.hostname === 'ropeman.pages.dev') {
				location.replace('https://ropeman.dev' + location.pathname + location.search + location.hash);
			}
			// Prerendered pages paint before the app boots. The stored theme applies now, as
			// themeStore would, so there is no dark-to-light flash. The landing is prerendered in
			// English, so a visitor whose locale (settingsStore, then the browser) is Korean has it
			// hidden until the app renders it in Korean (+layout.svelte removes the mark).
			try {
				const root = document.documentElement;
				if (localStorage.getItem('theme') === 'light') root.dataset.theme = 'light';
				const stored = JSON.parse(localStorage.getItem('ropeman-settings') || '{}').language;
				const preferred = (navigator.languages || [navigator.language])
					.map((tag) => String(tag).toLowerCase().split('-')[0])
					.find((tag) => tag === 'ko' || tag === 'en');
				if ((stored === 'ko' || stored === 'en' ? stored : preferred) === 'ko') {
					root.dataset.localePending = '';
				}
			} catch {}
		</script>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
		<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
		<title>Ropeman</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "19ee572887e344e6a1c60d57fc47ec2e"}'></script>
	</body>
</html>
