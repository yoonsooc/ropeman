name: Dependabot auto-merge

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'yoonsooc/ropeman'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # merge
      pull-requests: write # turn auto-merge on or off

    steps:
      - name: Read the Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # web-tree-sitter and tree-sitter-* wait for a person because each grammar .wasm must match the
      # runtime. Any ecosystem but npm waits because GITHUB_TOKEN cannot merge a change to
      # .github/workflows.
      - name: Turn auto-merge on or off
        env:
          # GitHub counts the merge as made by GITHUB_TOKEN, which starts no `push` run
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          held=$(jq -r --arg ecosystem "$ECOSYSTEM" '
            def one_or_later: .newVersion | test("^v?[1-9]");
            def merges_alone:
              (.dependencyName | test("^(web-tree-sitter|tree-sitter-.*)$") | not)
              and (.updateType == "version-update:semver-patch"
                or (.updateType == "version-update:semver-minor" and one_or_later));
            if $ecosystem != "npm_and_yarn" then "the \($ecosystem) ecosystem"
            else map(select(merges_alone | not) | "\(.dependencyName) \(.newVersion) (\(.updateType))") | join(", ")
            end' <<< "$UPDATES")
          auto=$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [ -z "$held" ]; then
            [ "$auto" = true ] || gh pr merge --auto --merge "$PR_URL"
          else
            echo "::notice::A person merges this pull request: $held"
            [ "$auto" = false ] || gh pr merge --disable-auto "$PR_URL"
          fi
