name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    # Pinned, not ubuntu-latest: Playwright ^1.58.2 ships no chromium-headless-shell for ubuntu-26.04
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci runs the prepare script, which already runs svelte-kit sync
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx svelte-check --tsconfig ./tsconfig.json

      - name: Type check workers
        run: |
          npm ci --prefix edge-proxy
          edge-proxy/node_modules/.bin/tsc --noEmit -p edge-proxy/tsconfig.json

      - name: Type check core
        run: npm run check:core

      - name: Worker tests
        run: npm test --prefix edge-proxy

      - name: Build
        run: npm run build

      # The bundled Node extractor must run on its own, with the .wasm files it copies beside it
      - name: Build core and extract a fixture
        run: |
          npm run build:core
          node packages/core/dist/cli.mjs tests/fixtures/graphs/ts-monorepo

      - name: Unit tests
        run: npm run test:unit

      # E2E runs on pull requests only. PR CI already ran it on the PR merged into main
      - name: Read Playwright version
        if: github.event_name == 'pull_request'
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: github.event_name == 'pull_request'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.ImageOS }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # No --with-deps: the runner image already has Chromium's libraries, and the extra fonts it
      # adds came through apt, whose mirror lookups stalled this step for minutes
      - name: Install Playwright Chromium
        if: github.event_name == 'pull_request' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium

      - name: E2E tests
        if: github.event_name == 'pull_request'
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Production deploy after CI passes on main. The Pages project is a direct-upload project
  # (no Git integration), so this job is the only automatic path to production.
  #
  # Workers are chosen by diffing against the `production` tag, the last commit whose deploy
  # finished. Diffing against the push's own `before` would lose changes when GitHub drops a
  # pending run from the concurrency group, and would never retry a worker that failed.
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # move the production tag
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Keep the write token out of .git/config, where install scripts could read it
          persist-credentials: false

      # CI runs can finish out of order. Only the newest main commit deploys, so an older
      # run can never roll production back
      - name: Check this is still the newest main commit
        id: latest
        run: |
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main has moved past $GITHUB_SHA; the newer run deploys"
          fi

      - name: Setup Node.js
        if: steps.latest.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.latest.outputs.deploy == 'true'
        run: npm ci

      # App first: the new app understands both old and new worker errors, the old app does not
      - name: Deploy app (Pages)
        if: steps.latest.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Find changed workers
        if: steps.latest.outputs.deploy == 'true'
        id: workers
        run: |
          git fetch -q --tags origin
          base=$(git rev-parse -q --verify 'refs/tags/production^{commit}' || echo "${{ github.event.before }}")
          echo "Diffing workers from $base"
          node scripts/changed-workers.mjs "$base" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Deploy changed workers
        if: steps.latest.outputs.deploy == 'true' && steps.workers.outputs.list != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci --prefix edge-proxy
          failed=""
          for worker in ${{ steps.workers.outputs.list }}; do
            npm --prefix edge-proxy run "deploy:$worker" || failed="$failed $worker"
          done
          if [ -n "$failed" ]; then
            echo "::error::worker deploy failed:$failed"
            exit 1
          fi

      # Only after every deploy succeeded, so a failed worker is picked up again next time
      - name: Move the production tag
        if: steps.latest.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f production "$GITHUB_SHA"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/tags/production

      - name: Health check
        if: steps.latest.outputs.deploy == 'true'
        run: |
          sleep 30 # let the new Pages deployment reach the edge
          node scripts/health-check.mjs
