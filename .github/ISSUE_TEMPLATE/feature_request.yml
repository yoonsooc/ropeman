name: Feature request
description: Suggest a change or a new capability.
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or the repository you were working on, and where Ropeman fell short.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: The change you have in mind. Rough is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: Workarounds or other tools you use for this.
