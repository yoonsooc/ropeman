name: Bug report
description: Something in Ropeman is wrong, crashes, or stopped working.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search the existing issues first. For a security problem, do not file it here. [Report it privately](https://github.com/yoonsooc/ropeman/security/advisories/new) instead.

  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options:
        - Web app (ropeman.dev)
        - Bridge (ropeman serve, map, verify, inbox, stop)
        - Agent skill (skill/ropeman/SKILL.md)
        - Explore gallery (ropeman.dev/explore)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran or the clicks you made, in order. Paste error output and the browser console if there was any.
      placeholder: |
        1. ropeman serve --root . --out .ropeman --local
        2. Open the printed address and click the src folder
        3. ...
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: The ones that apply. `ropeman --version` prints the bridge version.
      placeholder: |
        Bridge: 0.6.0
        Node: 22.x
        Browser: Chrome 142
        OS: macOS 15
        Coding agent: Claude Code 2.x
      render: text
    validations:
      required: true

  - type: textarea
    id: map
    attributes:
      label: Repository or map
      description: If you can share them, link the public repository you mapped or attach the `ropeman.json`. Leave this empty for private code.

  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, a screen recording, or what you already tried.
