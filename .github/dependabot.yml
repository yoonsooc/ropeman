version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci(deps)
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ['*']
        # A web-tree-sitter PR fails until someone reruns scripts/grammars/fetch.mjs to copy the
        # new engine .wasm into static/, so it must not hold the group back. Grammars come from
        # the GitHub releases in scripts/grammars/manifest.json, not npm (ADR-27).
        exclude-patterns: ['web-tree-sitter']
      security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # @types/node follows the Node major CI runs (22), so bump both together by hand
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 has no stable compiler API, which svelte-check and typescript-eslint need
      - dependency-name: typescript
        versions: ['7.x']

  - package-ecosystem: npm
    directory: /bridge
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # @types/node follows the Node major CI runs (22), so bump both together by hand
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 has no stable compiler API, which svelte-check and typescript-eslint need
      - dependency-name: typescript
        versions: ['7.x']

  - package-ecosystem: npm
    directory: /workers
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # @types/node follows the Node major CI runs (22), so bump both together by hand
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 has no stable compiler API, which svelte-check and typescript-eslint need
      - dependency-name: typescript
        versions: ['7.x']
