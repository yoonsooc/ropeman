services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ropeman
      POSTGRES_PASSWORD: ropeman
      POSTGRES_DB: ropeman
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ropeman"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
