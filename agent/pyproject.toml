[project]
name = "ropeman-agent"
version = "0.1.0"
description = "Code question answering over tree-sitter skeletons, with retrieval strategy evaluation"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic>=0.60",
    "fastapi>=0.115",
    "fastembed>=0.9.1",
    "google-genai>=1.0",
    "numpy>=1.26",
    "pgvector>=0.3",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "rank-bm25>=0.2.2",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
